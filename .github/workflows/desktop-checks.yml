name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/desktop/build-requirements.txt
      - run: python -m unittest discover -s tests/desktop
      - run: npm ci
        working-directory: apps/desktop
      - name: Verify Electron runtime
        working-directory: apps/desktop
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { throw 'Electron runtime missing' }
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm run test:desktop
        working-directory: apps/desktop
        env:
          DEBUG: pw:browser
      - run: npm run test:message-markdown
        working-directory: apps/desktop
      - run: npm run test:file-task
        working-directory: apps/desktop
      - run: npm run test:execution-access
        working-directory: apps/desktop
      - run: npm audit --audit-level=high
        working-directory: apps/desktop
      - name: Build isolated Windows package
        run: powershell -NoProfile -File apps/desktop/build-windows.ps1 -Unpacked
      - name: Verify packaged core without development runtimes
        working-directory: apps/desktop
        env:
          DEBUG: pw:browser
        run: |
          $env:BTK_DESKTOP_TEST_EXE = Join-Path (Get-Location) 'release/win-unpacked/AEGIS Agent Ops.exe'
          node tests/package-smoke.cjs --fresh-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/edition-boundary-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/agents-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/stdio-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/language-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/team-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/layout-transition-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/knowledge-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/google-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/gemini-cli-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/updates-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/transmission-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/workspace-tools-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/message-markdown-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/file-task-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/execution-access-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/workspace-archive-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/workspace-controls-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/codex-effort-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/image-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/public-screenshots.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BTK_DESKTOP_PREVIOUS_EXE = $env:BTK_DESKTOP_TEST_EXE
          node tests/upgrade-smoke.cjs
